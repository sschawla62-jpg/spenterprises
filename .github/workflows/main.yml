name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun/Node
        uses: oven-sh/setup-bun@v1 # Or use node setup if using npm

      - name: Install dependencies & Build
        run: |
          bun install
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        path: ./dist # Change to './build' or './out' depending on where your project outputs its production build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
